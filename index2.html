<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotizZettel V2.0</title>
    <link rel="stylesheet" href="CSS/NotizZettel2.css">
    <link rel="icon" type="image/png" href="EK.Bild.png=2">
</head>
<body>
    <!-- Die Klasse "main" sichert dein Design vom 06.08. -->
    <div class="main" id="App">
        <header>
            <h1>NotizZettel</h1>
            <p>Version 2.0 • <span id="datum"></span></p>
        </header>

        <div id="Arbeitsbereich">
            <div id="EingabeBereich" class="row">
                <!-- Die IDs 'NeueNotiz' und 'HaendlerAuswahl' sind für dein großes Skript überlebenswichtig -->
                <input id="NeueNotiz" autocomplete="off" placeholder="Neue Notiz eingeben...">
                <select id="HaendlerAuswahl">
                    <option value="">Händler...</option>
                    <option value="A">A</option>
                    <option value="Ac">Ac</option>
                    <option value="N">N</option>
                    <option value="L">L</option>
                    <option value="E">E</option>
                    <option value="R">R</option>
                </select>
                <button id="BtnHinzufuegen">Hinzufügen</button>
            </div>
            <div id="VorschlagBereich"></div>
            
            <div id="WerkzeugBereich">
                <button id="BtnMarkierteLoeschen" class="del">Markierte löschen</button>
                <button id="BtnSync">Sync</button>
                <button id="BtnGitHub">GitHub</button>
            </div>

            <div id="ListenBereich">
                <ul id="liste"></ul>
            </div>
        </div>
    </div>

    <!-- Lädt deine originale 1812-Zeilen-Logik aus dem Ordner "js" -->
    <script src="js/Notizen.js" defer></script>
    <script src="js/Woerterbuch.js" defer></script>
</body>
</html>
