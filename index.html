<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NotizZettel V2</title>

<link
    rel="icon"
    type="image/png"
    href="EK.Bild.png"
>

<link
    rel="stylesheet"
    href="https://raw.githubusercontent.com/PC-Opa/NotizZettel_V2/refs/heads/main/css/NotizZettel.css"
>

</head>

<body>

<div id="App">

    <header>

        <h1>NotizZettel</h1>

        <p>Version 2.0</p>

    </header>


    <main id="Arbeitsbereich">


        <section id="EingabeBereich">

            <input
                type="text"
                id="NeueNotiz"
                name="notiz"
                placeholder="Neue Notiz eingeben..."
                autocomplete="off"
                autocorrect="off"
                autocapitalize="sentences"
                spellcheck="false"
            >

            <select id="HaendlerAuswahl">

                <option value="">
                    Händler
                </option>

                <option value="A">A</option>
                <option value="N">N</option>
                <option value="E">E</option>
                <option value="L">L</option>
                <option value="R">R</option>

            </select>


            <button
                id="BtnHinzufuegen"
                type="button"
            >
                Hinzufügen
            </button>

        </section>


        <section id="VorschlagBereich">
        </section>


        <section id="WerkzeugBereich">

            <button
                id="BtnMarkierteLoeschen"
                type="button"
            >
                🗑️ Markierte löschen
            </button>


            <button
                id="BtnGitHub"
                type="button"
            >
                ☁️ GitHub
            </button>


            <button
                id="BtnSync"
                type="button"
            >
                🔄 Sync
            </button>

        </section>


        <section
            id="GitHubBereich"
            style="display:none;"
        >

            <input
                type="text"
                id="GitBenutzer"
                name="github-benutzer"
                placeholder="GitHub-Benutzer"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
            >


            <input
                type="text"
                id="GitRepository"
                name="github-repository"
                placeholder="Repository"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
            >


            <input
                type="password"
                id="GitToken"
                name="github-token"
                placeholder="GitHub-Token"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="none"
                spellcheck="false"
            >


            <button
                id="BtnGitSpeichern"
                type="button"
            >
                GitHub-Zugangsdaten speichern
            </button>

        </section>


        <section id="ListenBereich">
        </section>


    </main>

</div>


<script
    src="js/Notizen.js"
    defer
></script>

<script
    src="js/Woerterbuch.js"
    defer
></script>

<script
    src="js/Synchronisation.js"
    defer
></script>


</body>

</html>
