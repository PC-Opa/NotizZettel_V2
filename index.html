<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NotizZettel V2</title>

<link
    rel="icon"
    type="image/png"
    href="EK.Bild.png"
>

<link
    rel="stylesheet"
    href="https://raw.githubusercontent.com/PC-Opa/NotizZettel_V2/refs/heads/main/css/NotizZettel.css"
>

</head>


<body>

<div id="App">

    <header>

        <h1>NotizZettel</h1>

        <p>Version 2.0</p>

    </header>


    <main id="Arbeitsbereich">


        <!-- ==================================================
             NEUE NOTIZ
             ================================================== -->

        <section id="EingabeBereich">

            <input
                type="text"
                id="NeueNotiz"
                name="NeueNotiz"
                placeholder="Neue Notiz eingeben..."
                autocomplete="on"
                autocorrect="off"
                autocapitalize="sentences"
                spellcheck="false"
            >

            <select
                id="HaendlerAuswahl"
                name="HaendlerAuswahl"
                autocomplete="off"
            >

                <option value="">
                    Händler
                </option>

                <option value="A">A</option>
                <option value="N">N</option>
                <option value="E">E</option>
                <option value="L">L</option>
                <option value="R">R</option>

            </select>


            <button
                id="BtnHinzufuegen"
                type="button"
            >
                Hinzufügen
            </button>

        </section>


        <!-- ==================================================
             VORSCHLÄGE
             ================================================== -->

        <section id="VorschlagBereich">
        </section>


        <!-- ==================================================
             WERKZEUGE
             ================================================== -->

        <section id="WerkzeugBereich">

            <button
                id="BtnMarkierteLoeschen"
                type="button"
            >
                🗑️ Markierte löschen
            </button>


            <button
                id="BtnGitHub"
                type="button"
                autocomplete="off"
            >
                ☁️ GitHub
            </button>


            <button
                id="BtnSync"
                type="button"
            >
                🔄 Sync
            </button>

        </section>


        <!-- ==================================================
             GITHUB
             Die Eingabefelder werden erst beim Öffnen erzeugt.
             ================================================== -->

        <section
            id="GitHubBereich"
            style="display:none;"
        >
        </section>


        <!-- ==================================================
             NOTIZLISTE
             ================================================== -->

        <section id="ListenBereich">
        </section>


    </main>

</div>


<!-- ========================================================
     JAVASCRIPT
     ======================================================== -->

<script
    src="js/Notizen.js"
    defer
></script>


<script
    src="js/Woerterbuch.js"
    defer
></script>


<script
    src="js/Synchronisation.js"
    defer
></script>


<!-- ========================================================
     GITHUB-EINGABEFELDER ERST BEIM ÖFFNEN ERZEUGEN
     ======================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const btnGitHub =
            document.getElementById(
                "BtnGitHub"
            );

        const bereich =
            document.getElementById(
                "GitHubBereich"
            );


        if (
            !btnGitHub ||
            !bereich
        ) {

            return;
        }


        btnGitHub.addEventListener(
            "click",
            function () {

                if (
                    document.getElementById(
                        "GitBenutzer"
                    )
                ) {

                    return;
                }


                bereich.innerHTML = `

                    <div>

                        <input
                            type="text"
                            id="GitBenutzer"
                            name="github-user"
                            placeholder="GitHub-Benutzer"
                            autocomplete="username"
                            autocorrect="off"
                            autocapitalize="none"
                            spellcheck="false"
                        >

                    </div>


                    <div>

                        <input
                            type="text"
                            id="GitRepository"
                            name="github-repository"
                            placeholder="Repository"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="none"
                            spellcheck="false"
                        >

                    </div>


                    <div>

                        <input
                            type="password"
                            id="GitToken"
                            name="github-token"
                            placeholder="GitHub-Token"
                            autocomplete="new-password"
                            autocorrect="off"
                            autocapitalize="none"
                            spellcheck="false"
                        >

                    </div>


                    <div>

                        <button
                            id="BtnGitSpeichern"
                            type="button"
                        >
                            GitHub-Zugangsdaten speichern
                        </button>

                    </div>

                `;


                bereich.style.display =
                    "block";


                if (
                    typeof githubDatenLaden ===
                    "function"
                ) {

                    githubDatenLaden();


                    const benutzer =
                        document.getElementById(
                            "GitBenutzer"
                        );

                    const repository =
                        document.getElementById(
                            "GitRepository"
                        );

                    const token =
                        document.getElementById(
                            "GitToken"
                        );


                    if (
                        benutzer &&
                        typeof github !==
                            "undefined"
                    ) {

                        benutzer.value =
                            github.benutzer;
                    }


                    if (
                        repository &&
                        typeof github !==
                            "undefined"
                    ) {

                        repository.value =
                            github.repository;
                    }


                    if (
                        token &&
                        typeof github !==
                            "undefined"
                    ) {

                        token.value =
                            github.token;
                    }
                }


                const btnSpeichern =
                    document.getElementById(
                        "BtnGitSpeichern"
                    );


                if (
                    btnSpeichern &&
                    typeof githubDatenSpeichern ===
                        "function"
                ) {

                    btnSpeichern.addEventListener(
                        "click",
                        githubDatenSpeichern
                    );
                }

            },
            {
                once: true
            }
        );

    }
);

</script>


</body>

</html>
