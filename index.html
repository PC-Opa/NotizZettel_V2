<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NotizZettel V2</title>

    <link rel="stylesheet" href="css/NotizZettel.css">

</head>

<body>

    <div id="App">

        <header>

            <h1>NotizZettel</h1>

            <p>Version 2.0</p>

        </header>

        <main id="Arbeitsbereich">

            <section id="EingabeBereich">

                <input
                    type="text"
                    id="NeueNotiz"
                    placeholder="Neue Notiz eingeben..."
                    autocomplete="off">

                <button id="BtnHinzufuegen">
                    Hinzufügen
                </button>

            </section>

            <section id="VorschlagBereich">
            </section>

            <section id="WerkzeugBereich">

                <button id="BtnMarkierteLoeschen">
                    🗑️ Markierte löschen
                </button>

                <button id="BtnGitHub">
                    ☁️ GitHub
                </button>

                <button id="BtnSync">
                    🔄 Sync
                </button>

            </section>

            <section id="GitHubBereich" style="display:none;">

                <input
                    type="text"
                    id="GitBenutzer"
                    placeholder="GitHub-Benutzer">

                <input
                    type="text"
                    id="GitRepository"
                    placeholder="Repository">

                <input
                    type="password"
                    id="GitToken"
                    placeholder="GitHub-Token">

                <button id="BtnGitSpeichern">
                    Zugangsdaten speichern
                </button>

            </section>

            <section id="ListenBereich">
            </section>

            <section id="StatusBereich">
            </section>

        </main>

    </div>

    <script src="js/Woerterbuch.js"></script>
    <script src="js/Notizen.js"></script>
    <script src="js/Synchronisation.js"></script>
    <script src="js/App.js"></script>

</body>

</html>
